<!DOCTYPE html>
<html lang="pt" th:replace="~{layout :: layout}">
  <main th:fragment="content">
    <div class="container" id="form-cadastro">
      <a class="text-dark" href="/turmas/listar" role="button">
        <span
          class="oi oi-spreadsheet"
          title="Cadastro"
          aria-hidden="true"
        ></span>
        <span>Listar Turmas</span>
      </a>
      <hr class="mb-5" />

      <h3>Turma</h3>

      <form
        th:action=" ${turma.id == null} ? @{/turmas/salvar} : @{/turmas/editar}"
        method="POST"
        th:object="${turma}"
      >
        <div class="form-row">
          <div class="form-group col-md-3 my-2">
            <label for="semestre">Semestre*</label>
            <select
              class="form-control"
              id="semestre"
              th:field="*{semestre}"
              required
            >
              <option value="" selected>Selecione o Semestre</option>
              <option
                th:each="s : ${semestres}"
                th:value="${s.id}"
                th:text="${s.ano} + '.' + ${s.semestre}"
              ></option>
            </select>
          </div>

          <div class="form-group col-md-3 my-2">
            <label for="disciplina">Disciplina*</label>
            <select
              class="form-control"
              id="disciplina"
              th:field="*{disciplina}"
              required
            >
              <option value="" selected>Selecione a disciplina</option>
              <option
                th:each="obj : ${disciplinas}"
                th:value="${obj.id}"
                th:text="${obj.codigo} + ' - ' + ${obj.nome}"
              ></option>
            </select>
          </div>

          <div class="form-group col-md-6 my-2">
            <label for="horario">Horário*</label>
            <input
              type="text"
              class="form-control"
              id="horario"
              placeholder="Ex: 8:00 - 10:00"
              th:field="*{horario}"
              required
            />
          </div>

          <div class="form-group col-md-6 my-2">
            <label for="professor">Professor</label>
            <input
              type="text"
              class="form-control"
              id="professor"
              placeholder="Nome Completo do Professor"
              th:field="*{professor}"
            />
          </div>
        </div>
        <input type="hidden" th:field="*{id}" />
        <button type="submit" class="btn btn-warning btn-md mt-3">
          <span class="oi oi-check" title="Cadastro" aria-hidden="true"></span>
          Salvar
        </button>
      </form>
    </div>
  </main>
</html>

<!DOCTYPE html>
<html lang="pt" th:replace="~{layout :: layout}">
  <main th:fragment="content">
    <div class="container">
      <a class="text-dark" href="/turmas/cadastrar" role="button">
        <span class="oi oi-plus" title="Cadastro" aria-hidden="true"></span>
        <span>Cadastrar</span>
      </a>
      <hr class="mb-5" />

      <h3>Turmas</h3>
      <div class="table-responsive">
        <table class="table table-striped table-hover table-sm">
          <thead>
            <tr>
              <th>#</th>
              <th>Semestre</th>
              <th>Disciplina</th>
              <th>Horário</th>
              <th>Professor</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="turma : ${turmas}">
              <td th:text="${turma.id}"></td>
              <td
                th:text="${turma.semestre.ano} + '.' + ${turma.semestre.semestre}"
              ></td>
              <td
                th:text="${turma.disciplina.codigo} + ' - ' + ${turma.disciplina.nome}"
              ></td>
              <td th:text="${turma.horario}"></td>
              <td th:text="${turma.professor}"></td>
              <td colspan="2">
                <a
                  class="btn btn-info btn-sm"
                  th:href="@{/turmas/editar/{id} (id=${turma.id})}"
                  role="button"
                >
                  <span
                    class="oi oi-pencil"
                    title="Editar"
                    aria-hidden="true"
                  ></span>
                </a>

                <a
                  class="btn btn-danger btn-sm"
                  th:href="@{/turmas/excluir/{id} (id=${turma.id})} "
                  role="button"
                >
                  <span
                    class="oi oi-trash"
                    title="Excluir"
                    aria-hidden="true"
                  ></span>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</html>

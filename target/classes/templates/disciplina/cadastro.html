<!DOCTYPE html>
<html lang="pt" th:replace="~{layout :: layout}">
  <main th:fragment="content">
    <div class="container" id="form-cadastro">
      <a class="text-dark" href="/disiciplinas/listar" role="button">
        <span
          class="oi oi-spreadsheet"
          title="Cadastro"
          aria-hidden="true"
        ></span>
        <span>Listar Disiciplinas</span>
      </a>
      <hr class="mb-5" />

      <h3>Disiciplina</h3>

      <form
        th:action=" ${disiciplina.id == null} ? @{/disiciplinas/salvar} : @{/disiciplinas/editar}"
        method="POST"
        th:object="${disiciplina}"
      >
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="nome">Nome da Disiciplina</label>
            <input
              type="text"
              class="form-control"
              id="nome"
              placeholder="Nome"
              th:field="*{nome}"
            />
          </div>
          <div class="form-group col-md-6">
            <label for="codigo">Código</label>
            <input
              type="text"
              class="form-control"
              id="codigo"
              placeholder="Código"
              th:field="*{codigo}"
              maxlength="20"
            />
          </div>
          <div class="form-group col-md-6">
            <label for="matricula">Matrícula</label>
            <input
              type="text"
              class="form-control"
              id="matricula"
              placeholder="Matrícula"
              th:field="*{matricula}"
            />
          </div>
        </div>
        <input type="hidden" th:field="*{id}" />
        <button type="submit" class="btn btn-warning btn-md mt-3">
          <span class="oi oi-check" title="Cadastro" aria-hidden="true"></span>
          Salvar
        </button>
      </form>
    </div>
  </main>
</html>

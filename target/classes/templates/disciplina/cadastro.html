<!DOCTYPE html>
<html lang="pt" th:replace="~{layout :: layout}">
  <main th:fragment="content">
    <div class="container" id="form-cadastro">
      <a class="text-dark" href="/disciplinas/listar" role="button">
        <span
          class="oi oi-spreadsheet"
          title="Cadastro"
          aria-hidden="true"
        ></span>
        <span>Listar Disciplinas</span>
      </a>
      <hr class="mb-5" />

      <h3>Disciplina</h3>

      <form
        th:action=" ${disciplina.id == null} ? @{/disciplinas/salvar} : @{/disciplinas/editar}"
        method="POST"
        th:object="${disciplina}"
      >
        <div class="form-row">
          <div class="form-group col-md-6 my-2">
            <label for="nome">Nome da Disciplina*</label>
            <input
              type="text"
              class="form-control"
              id="nome"
              placeholder="Nome"
              th:field="*{nome}"
              required
            />
          </div>
          <div class="form-group col-md-6 my-2">
            <label for="codigo">Código*</label>
            <input
              type="text"
              class="form-control"
              id="codigo"
              placeholder="Código"
              th:field="*{codigo}"
              maxlength="20"
              required
            />
          </div>
          <div class="form-group col-md-2 my-2">
            <label for="cargaHoraria">Carga Horária*</label>
            <input
              type="number"
              class="form-control"
              id="cargaHoraria"
              placeholder="Ex: 80"
              th:field="*{cargaHoraria}"
              min="1"
              max="200"
              required
            />
          </div>

          <div class="form-group col-md-6 my-2">
            <label for="ementa">Ementa</label>
            <textarea
              class="form-control"
              id="ementa"
              placeholder="Ementa"
              th:field="*{ementa}"
            ></textarea>
          </div>
        </div>
        <input type="hidden" th:field="*{id}" />
        <button type="submit" class="btn btn-warning btn-md mt-3">
          <span class="oi oi-check" title="Cadastro" aria-hidden="true"></span>
          Salvar
        </button>
      </form>
    </div>
  </main>
</html>

services:
  mysql:
    image: 'mysql:latest'
    container_name: mysql_container
    environment:
      MYSQL_DATABASE: 'tjw'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: '@abcd1234'
      MYSQL_ROOT_PASSWORD: '@abcd1234'
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
<!DOCTYPE html>
<html
  lang="pt"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
>
  <body>
    <!-- Fragmento de Cabeçalho -->
    <div th:fragment="header">
      <header>
        <nav class="navbar navbar-inverse navbar navbar-dark bg-dark fixed-top">
          <div class="container-fluid">
            <div class="navbar-header">
              <button
                type="button"
                class="btn btn-dark navbar-toggle pull-left"
              >
                <i class="oi oi-menu"></i>
              </button>
              <a class="navbar-brand navbar-toggle pull-left" href="#"
                >Sistema Escolar</a
              >
            </div>
          </div>
        </nav>
      </header>

      <div class="layout-main">
        <aside>
          <nav class="sidebar sidebar-open">
            <ul class="nav nav-pills">
              <li class="nav-item">
                <a class="nav-link" href="/">
                  <i class="oi oi-home"></i> <span>Home</span>
                </a>
              </li>
            </ul>

            <ul class="nav nav-pills">
              <li class="nav-item">
                <span class="nav-link active">Alunos</span>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/alunos/cadastrar">
                  <i class="oi oi-plus"></i>
                  <span>Cadastrar </span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/alunos/listar">
                  <i class="oi oi-spreadsheet"></i>
                  <span>Listar </span>
                </a>
              </li>
            </ul>
            <ul class="nav nav-pills">
              <li class="nav-item">
                <span class="nav-link active">Disciplinas</span>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/alunos/cadastrar">
                  <i class="oi oi-plus"></i>
                  <span>Cadastrar </span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/alunos/listar">
                  <i class="oi oi-spreadsheet"></i>
                  <span>Listar </span>
                </a>
              </li>
            </ul>
          </nav>
        </aside>

        <!-- Conteúdo dinâmico das páginas -->
        <section class="layout-content" th:insert="~{::content}"></section>
      </div>
    </div>

    <!-- Fragmento de Rodapé -->
    <div th:fragment="footer">
      <footer class="layout-footer">
        <div class="container"></div>
      </footer>

      <!-- Bootstrap core JavaScript
================================================== -->
      <!-- Placed at the end of the document so the pages load faster -->
      <script src="/webjars/jquery/jquery.min.js"></script>
      <script src="/webjars/jquery-mask-plugin/dist/jquery.mask.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
      <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
      <script type="text/javascript">
        $(function () {
          $('[data-toggle="popover"]').popover();
        });

        $(document).ready(function () {
          $(".navbar-toggle").click(function () {
            $(".sidebar").toggleClass("sidebar-open");
          });
        });

        $(document).ready(function () {
          $(".cpf").mask("000.000.000-00");
        });
      </script>
    </div>
  </body>
</html>
